name: Build and deploy

on:
  push:
    branches: [hexo]
  pull_request:
    branches: [hexo]
  workflow_dispatch:

permissions:
  contents: write

# Deploys force-push to master, so never run two at once. Queue instead of
# cancelling, so an in-flight publish is not interrupted half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate site
        run: npx hexo generate

      # No custom domain: the blog is served at mycaule.github.io and
      # www.commutator.io now belongs to the consulting site. The publish step
      # replaces master wholesale with public/, which carries no CNAME, so the
      # next deploy clears any stale custom domain rather than claiming one.

      - name: Publish to master
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site updated: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            master
